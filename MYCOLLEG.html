<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color:forestgreen
        }
        /*ID Selector*/
        #intro{
            color:blue
        }
        .note{
            color:red
        }
        .box{
            color: rgb(71, 223, 25);
            width: 200px;
            height: 100px;
            border: 2px solid black;
            padding: 20px;
            margin: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1 class="box">This is my college</h1>
    <p id="intro" class="note">Welcome to my college!</p>
    <p class="note">This is a simple paragraph about my college.</p>
    <p class="note">This  simple paragraph about my college.</p>
</body>
</html>
