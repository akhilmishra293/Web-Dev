<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p
        {
            color: red;
        }
        img{
            width:100%;
            height: 100%;
            object-position: center;
        }
        p.top
        {
            position: fixed;
            top: 0%;
        }
        p.mid
        {
            position: fixed;
            top: 50%;
        }
        p.bottom
        {
            position: fixed;
            bottom: 0;
        }
        *{
            margin: 0;
            padding: 0;
        }
        #centre{
            text-align: center;        }
        #right{
            text-align: right;
        }
        p
        {
            width: 100%;
        }
    </style>
</head>
<body>
    <img src="akhil.jpeg" alt="">
    <p class="top" id="centre">AkhilMishra</p>
    <p class="top">AkhilMishra</p>
    <p class="top" id="right">AkhilMishra</p>
    <p class="mid" id="centre">AkhilMishra</p>
    <p class="mid">AkhilMishra</p>
    <p class="mid" id="right">AkhilMishra</p>
    <p class="bottom" id="centre">AkhilMishra  </p>
    <p class="bottom">AkhilMishra</p>
    <p class="bottom" id="right">AkhilMishra  </p>
</body>
</html>
